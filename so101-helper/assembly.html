// ─── Catalogue mode ───
let catalogueMode = false;
let catalogueTargets = new Map();  // mesh → { pos: Vector3 }
let catalogueTween = 0;           // 0 = assembled, 1 = exploded
let catalogueLabels = [];         // CSS2DObject instances
let labelRenderer = null;

const LINK_ORDER = ['base_link', 'shoulder_link', 'upper_arm_link', 'lower_arm_link', 'wrist_link', 'gripper_link', 'moving_jaw_so101_v1_link'];
const LINK_DISPLAY = {
  'base_link': 'Base',
  'shoulder_link': 'Shoulder',
  'upper_arm_link': 'Upper Arm',
  'lower_arm_link': 'Forearm',
  'wrist_link': 'Wrist',
  'gripper_link': 'Gripper',
  'moving_jaw_so101_v1_link': 'Jaw',
};

function initLabelRenderer() {
  if (labelRenderer) return;
  labelRenderer = new CSS2DRenderer();
  labelRenderer.setSize(window.innerWidth, window.innerHeight);
  labelRenderer.domElement.style.position = 'absolute';
  labelRenderer.domElement.style.top = '0';
  labelRenderer.domElement.style.left = '0';
  labelRenderer.domElement.style.pointerEvents = 'none';
  document.body.appendChild(labelRenderer.domElement);
  window.addEventListener('resize', () => {
    labelRenderer.setSize(window.innerWidth, window.innerHeight);
  });
}

function computeCatalogueLayout() {
  catalogueTargets.clear();
  if (!robot) return;

  const spacing = 0.08;
  const linkGap = 0.12;
  let groupX = 0;

  for (const linkName of LINK_ORDER) {
    const meshList = linkMeshes.get(linkName);
    if (!meshList) continue;

    let partIdx = 0;
    for (const entry of meshList) {
      const mesh = entry.mesh;
      if (!mesh) continue;

      const box = new THREE.Box3().setFromObject(mesh);
      const center = new THREE.Vector3();
      box.getCenter(center);
      const size = new THREE.Vector3();
      box.getSize(size);

      const targetWorld = new THREE.Vector3(
        groupX + partIdx * spacing,
        size.y * 0.5 + 0.01,
        0
      );

      catalogueTargets.set(mesh, { pos: targetWorld });
      partIdx++;
    }

    groupX += Math.max(partIdx, 1) * spacing + linkGap;
  }
}

function createCatalogueLabels() {
  clearCatalogueLabels();
  initLabelRenderer();
  if (!robot) return;

  let groupX = 0;
  const spacing = 0.08;
  const linkGap = 0.12;

  for (const linkName of LINK_ORDER) {
    const meshList = linkMeshes.get(linkName);
    if (!meshList || meshList.length === 0) continue;

    const displayName = LINK_DISPLAY[linkName] || linkName;
    const groupLabel = document.createElement('div');
    groupLabel.className = 'cat-label cat-group-label';
    groupLabel.textContent = displayName;
    const groupObj = new CSS2DObject(groupLabel);
    groupObj.position.set(groupX + (meshList.length - 1) * spacing * 0.5, -0.02, 0);
    scene.add(groupObj);
    catalogueLabels.push(groupObj);

    let partIdx = 0;
    for (const entry of meshList) {
      const mesh = entry.mesh;
      if (!mesh) continue;

      const partName = entry.filename
        .replace(/_/g, ' ')
        .replace(/\b\w/g, c => c.toUpperCase());

      const label = document.createElement('div');
      label.className = 'cat-label';
      label.innerHTML = partName + '<span class="cat-sub">' + displayName + ' #' + (partIdx + 1) + '</span>';
      const labelObj = new CSS2DObject(label);

      const target = catalogueTargets.get(mesh);
      if (target) {
        const box = new THREE.Box3().setFromObject(mesh);
        const size = new THREE.Vector3();
        box.getSize(size);
        labelObj.position.copy(target.pos).add(new THREE.Vector3(0, size.y * 0.5 + 0.02, 0));
      }
      scene.add(labelObj);
      catalogueLabels.push(labelObj);
      partIdx++;
    }

    groupX += Math.max(meshList.length, 1) * spacing + linkGap;
  }
}

function clearCatalogueLabels() {
  for (const obj of catalogueLabels) {
    scene.remove(obj);
    if (obj.element && obj.element.parentNode) obj.element.parentNode.removeChild(obj.element);
  }
  catalogueLabels = [];
}

function applyCatalogueTween(blend) {
  if (!robot || catalogueTargets.size === 0) return;

  for (const [mesh, target] of catalogueTargets) {
    const orig = originalTransforms.get(mesh);
    if (!orig) continue;

    const worldOrig = new THREE.Vector3();
    mesh.parent.updateWorldMatrix(true, false);
    worldOrig.copy(orig.pos);
    mesh.parent.localToWorld(worldOrig);

    const worldTarget = target.pos;
    const blended = new THREE.Vector3().lerpVectors(worldOrig, worldTarget, blend);

    const localPos = blended.clone();
    mesh.parent.worldToLocal(localPos);
    mesh.position.copy(localPos);

    mesh.quaternion.copy(orig.quat);
  }
}

function toggleCatalogue() {
  catalogueMode = !catalogueMode;
  document.getElementById('toggle-catalogue').classList.toggle('active', catalogueMode);

  if (catalogueMode) {
    playing = false;
    computeCatalogueLayout();
    createCatalogueLabels();
    for (const si of screw3DInstances) si.mesh.visible = false;
    toast('Catalogue mode — parts laid out by group');
  } else {
    clearCatalogueLabels();
    catalogueTween = 0;
    for (const si of screw3DInstances) si.mesh.visible = true;
    applyAnimationState();
    toast('Catalogue mode off');
  }
}

document.getElementById('export-seq-btn').addEventListener('click', () => {
  const data = {
    duration: totalDuration,
    steps: steps.map(s => {
      const out = {
        id: s.id,
        target: s.target,
        link: s.link,
        start_offset: {
          pos: s.start_offset.pos.map(v => Math.round(v * 1000000) / 1000000),
          rot: s.start_offset.rot.map(v => Math.round(v * 1000000) / 1000000),
        },
        time: s.time.map(v => Math.round(v * 100) / 100),
        easing: s.easing,
      };
      if (s.screw_rotations) out.screw_rotations = s.screw_rotations;
      if (s.fade_lead != null) out.fade_lead = s.fade_lead;
      if (s.chapter) out.chapter = s.chapter;
      return out;
    }),
  };
  const json = JSON.stringify(data, null, 2);
  navigator.clipboard.writeText(json).then(() => toast('Copied to clipboard')).catch(() => {});
  const blob = new Blob([json], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'assembly_sequence.json'; a.click();
  URL.revokeObjectURL(url);
  toast(`Exported ${steps.length} steps`);
});

// ─── Export GLB ───
document.getElementById('export-glb-btn').addEventListener('click', async () => {
  if (steps.length === 0) { toast('No steps to export'); return; }
  try {
    toast('Baking animation...');
    robot.updateMatrixWorld(true);
    const glb = await exportAssemblyGLB(
      robot, steps, totalDuration,
      originalTransforms, screw3DInstances, partsCatalog,
      linkLocalToWorld, worldToLinkLocal
    );
    const blob = new Blob([glb], { type: 'model/gltf-binary' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'assembly_animation.glb'; a.click();
    URL.revokeObjectURL(url);
    toast(`Exported GLB (${steps.length} tracks)`);
  } catch (err) {
    console.error('GLB export failed:', err);
    toast('GLB export failed: ' + err.message);
  }
});

// ─── Export LS Config ───
document.getElementById('export-ls-btn').addEventListener('click', () => {
  if (steps.length === 0) { toast('No steps to export'); return; }
  const config = generateLSConfig(steps, totalDuration);
  const json = JSON.stringify(config, null, 2);
  navigator.clipboard.writeText(json).then(() => toast('LS config copied')).catch(() => {});
  const blob = new Blob([json], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'assembly-mech-config.json'; a.click();
  URL.revokeObjectURL(url);
  toast(`Exported LS config (${config.mechanical_steps.length} steps)`);
});

document.getElementById('load-seq-btn').addEventListener('click', () => document.getElementById('load-seq-file').click());
document.getElementById('load-seq-file').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    try {
      const data = JSON.parse(ev.target.result);
      steps = (data.steps || []).map(s => {
        if (s.fade_lead == null) s.fade_lead = s.id?.startsWith('screw/') ? 0.15 : 0.3;
        return s;
      });
      totalDuration = data.duration || 30;
      document.getElementById('total-duration').value = totalDuration;
      selectedStepIdx = -1;
      updatePartsUI();
      updateStepEditor();
      updateTimeline();
      applyAnimationState();
      toast(`Loaded ${steps.length} steps`);
    } catch (err) { toast('Error parsing JSON'); console.error(err); }
  };
  reader.readAsText(file);
});

// ─── Reset ───
document.getElementById('save-btn').addEventListener('click', manualSave);

document.getElementById('reset-all-btn').addEventListener('click', () => {
  if (!confirm('Clear all steps and reset localStorage?')) return;
  steps = [];
  selectedStepIdx = -1;
  selectedPart = null;
  localStorage.removeItem(SEQUENCE_STORAGE_KEY);
  // Remove the legacy unversioned value so it cannot reintroduce offsets if
  // this page is opened from an older build.
  localStorage.removeItem('assembly_sequence');
  hideGizmo();
  updatePartsUI();
  updateStepEditor();
  updateOutlines();
  updateTimeline();
  applyAnimationState();
  toast('Reset complete');
});

// ─── Keyboard ───
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  if (e.key === 's' && (e.metaKey || e.ctrlKey)) {
    e.preventDefault();
    manualSave();
    return;
  }
  if (e.key === ' ') {
    e.preventDefault();
    document.getElementById('tl-play').click();
  }
  if (e.key === 'Escape') {
    selectStep(-1);
    hideGizmo();
  }
  if (e.key === 'Delete' || e.key === 'Backspace') {
    if (selectedStepIdx >= 0) removeStep(selectedStepIdx);
  }
  if (e.key === 'Home') {
    currentTime = 0; applyAnimationState(); updateTimeline();
  }
  if (e.key === 'End') {
    currentTime = totalDuration; applyAnimationState(); updateTimeline();
  }
  // J/K/L shuttle (After Effects)
  if (e.key === 'j') {
    currentTime = Math.max(0, currentTime - 0.1); applyAnimationState(); updateTimeline();
  }
  if (e.key === 'k') {
    if (playing) document.getElementById('tl-play').click();
  }
  if (e.key === 'l') {
    currentTime = Math.min(totalDuration, currentTime + 0.1); applyAnimationState(); updateTimeline();
  }
  // Zoom
  if (e.key === '=' || e.key === '+') {
    tlZoomX = Math.min(30, tlZoomX * 1.3); drawTimeline();
  }
  if (e.key === '-') {
    tlZoomX = Math.max(1, tlZoomX / 1.3); drawTimeline();
  }
  if (e.key === '0' && !e.metaKey && !e.ctrlKey) {
    tlZoomX = 1; tlScrollX = 0; tlScrollY = 0; drawTimeline();
  }
});

// ─── Init ───
async function init() {
  try {
    robot = await loadURDF();
    robot.rotation.x = -Math.PI / 2;
    scene.add(robot);
    robot.updateMatrixWorld(true);

    // Wait for STL meshes to finish loading (SO-101 has ~17 mesh files)
    const meshCount = await waitForMeshes(robot, 14, 20000);
    robot.updateMatrixWorld(true);
    buildMeshToLinkMap(robot);

    // Rebuild again after a delay to catch any late-loading meshes
    setTimeout(() => {
      let mc = 0;
      robot.traverse(c => { if (c.isMesh) mc++; });
      if (mc > meshCount) {
        console.log(`[init] Late meshes detected (${mc} vs ${meshCount}), rebuilding...`);
        meshToLink.clear();
        linkMeshes.clear();
        buildMeshToLinkMap(robot);
        captureOriginalTransforms();
        buildPartsCatalog();
        updatePartsUI();
      }
    }, 5000);

    const defaults = { shoulder_pan: 0, shoulder_lift: 0, elbow_flex: 0, wrist_flex: 0, wrist_roll: 0, gripper: 0.5 };
    for (const [j, v] of Object.entries(defaults)) {
      if (robot.joints[j]) robot.setJointValue(j, v);
    }
    robot.updateMatrixWorld(true);

    await loadExtraGLBs();
    captureOriginalTransforms();
    await loadScrewGLB();
    await loadAnnotations();
    spawnScrews();

    buildPartsCatalog();

    updatePartsUI();
    buildJointSliders();

    // Load only saved data authored against the current sequence schema.
    // Older unversioned data targeted a different URDF/catalog and can leave
    // parts at unrelated transforms, so the canonical sequence is safer.
    try {
      const saved = localStorage.getItem(SEQUENCE_STORAGE_KEY);
      let data;
      if (saved) {
        const parsed = JSON.parse(saved);
        if (parsed.schema_version === SEQUENCE_SCHEMA_VERSION && parsed.steps?.length > 0) {
          data = parsed;
          toast(`Restored ${data.steps.length} steps`);
        }
      }
      if (!data) {
        const resp = await fetch('./default-sequence.json');
        if (resp.ok) {
          data = await resp.json();
          toast(`Loaded default: ${data.steps?.length || 0} steps`);
        }
      }
      if (data) {
        steps = (data.steps || []).map(s => {
          if (s.fade_lead == null) s.fade_lead = s.id?.startsWith('screw/') ? 0.15 : 0.3;
          return s;
        });
        totalDuration = data.duration || 26;
        document.getElementById('total-duration').value = totalDuration;
        updatePartsUI();
      }
    } catch (e) { console.warn('[init] sequence load error:', e); }

    resizeTimeline();
    applyAnimationState();
    toast(`Loaded: ${partsCatalog.length} parts, ${screwAnnotations.length} screws`);
  } catch (e) {
    console.error('Init error:', e);
  }
}

// Auto-save to localStorage on changes
function autoSave() {
  const data = {
    schema_version: SEQUENCE_SCHEMA_VERSION,
    model: 'so101_new_calib',
    duration: totalDuration,
    steps: steps.map(s => ({
      id: s.id, target: s.target, link: s.link,
      start_offset: s.start_offset, time: s.time, easing: s.easing,
      screw_rotations: s.screw_rotations,
      fade_lead: s.fade_lead,
      chapter: s.chapter,
    })),
  };
  localStorage.setItem(SEQUENCE_STORAGE_KEY, JSON.stringify(data));
}

function manualSave() {
  autoSave();
  toast('Saved to localStorage');
}

// Save periodically
setInterval(autoSave, 3000);

init();

// ─── Render loop ───
window.addEventListener('resize', () => {
  composer.setSize(innerWidth, innerHeight);
  resizeTimeline();
});

function animate(now) {
  requestAnimationFrame(animate);
  controls.update();

  if (playing) {
    const dt = (now - lastFrameTime) / 1000;
    lastFrameTime = now;
    currentTime += dt;
    if (currentTime > totalDuration) currentTime = 0;
    updateTimeline();
  }

  // Always apply — keeps mesh positions consistent with step data
  applyAnimationState();

  // Catalogue mode: tween blend and override positions
  if (catalogueMode) {
    const target = 1;
    catalogueTween += (target - catalogueTween) * 0.08;
    if (Math.abs(catalogueTween - target) < 0.001) catalogueTween = target;
    applyCatalogueTween(catalogueTween);
  } else if (catalogueTween > 0.001) {
    catalogueTween *= 0.9;
    if (catalogueTween < 0.001) catalogueTween = 0;
    applyCatalogueTween(catalogueTween);
  }

  composer.render();
  if (labelRenderer && catalogueLabels.length > 0) labelRenderer.render(scene, camera);
  gnomon.update();
}
requestAnimationFrame(animate);
</script>
