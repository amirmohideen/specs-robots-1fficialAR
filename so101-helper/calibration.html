<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="SO-101 calibration." />
    <title>Calibration Inspector · SO-101 Helper</title>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body data-page="calibration">
    <header class="site-header">
      <a class="brand" href="./" aria-label="SO-101 Helper home"><span class="brand-mark" aria-hidden="true">S101</span><span>SO-101 Helper</span></a>
      <nav class="site-nav" aria-label="Primary navigation">
        <a href="./">Docs</a>
        <a href="./calibration.html" aria-current="page">Calibration</a>
        <a href="./assembly.html">Assembly</a>
        <a href="https://github.com/a-sumo/so101-helper" rel="noreferrer">GitHub ↗</a>
      </nav>
    </header>

    <main class="workspace-main">
      <section class="workspace-intro">
        <div>
          <p class="eyebrow">SO-101 HELPER</p>
          <h1>Calibration</h1>
          <p>Calibration JSON → joint range.</p>
        </div>
        <a class="button button-secondary" href="https://huggingface.co/docs/lerobot/main/en/so101#calibration" rel="noreferrer">Calibration guide ↗</a>
      </section>

      <section class="control-panel dot-surface">
        <div class="upload-zone" id="calibration-drop" tabindex="0" role="button" aria-controls="calibration-file">
          <div class="upload-icon" aria-hidden="true">{ }</div>
          <div><strong>Calibration JSON</strong><span>This device</span></div>
          <button class="button button-primary" type="button" id="select-calibration">Select</button>
          <input id="calibration-file" type="file" accept="application/json,.json" hidden />
        </div>
        <div class="panel-actions">
          <button class="button button-secondary" type="button" id="load-example">Example</button>
          <span class="privacy-note">LOCAL</span>
        </div>
      </section>

      <section class="summary-strip" id="calibration-summary" aria-live="polite">
        <div><span class="summary-label">STATUS</span><strong id="summary-status">Awaiting file</strong></div>
        <div><span class="summary-label">MOTORS</span><strong id="summary-motors">—</strong></div>
        <div><span class="summary-label">WARNINGS</span><strong id="summary-warnings">—</strong></div>
        <div><span class="summary-label">SOURCE</span><strong id="summary-source">Local file</strong></div>
      </section>

      <section>
        <div class="section-heading compact">
          <p class="eyebrow">PHYSICAL BOUNDS</p>
          <h2>Joint envelopes</h2>
        </div>
        <div class="joint-grid" id="joint-grid">
          <div class="empty-state">Load JSON.</div>
        </div>
      </section>

      <section class="message-panel" id="calibration-messages" hidden aria-live="polite"></section>
    </main>

    <footer class="site-footer"><span>Calibration</span></footer>
    <script type="module" src="./src/calibration.js"></script>
  </body>
</html>
